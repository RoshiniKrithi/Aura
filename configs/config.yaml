system:
  seed: 42
  device: "auto"  # Choices: "auto", "cuda", "mps", "cpu"
  num_workers: 4
  pin_memory: true
  deterministic: true

logging:
  level: "INFO"  # Choices: "DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"
  file_logging: true
  log_dir: "outputs/logs"

model:
  name: "aura-gpt-base"
  vocab_size: 50257
  max_sequence_length: 1024
  d_model: 768
  n_layers: 12
  n_heads: 12
  d_ff: 3072
  dropout: 0.1
  bias: false
  initializer_range: 0.02

tokenizer:
  vocab_size: 50257
  special_tokens:
    pad_token: "<|pad|>"
    unk_token: "<|unk|>"
    bos_token: "<|startoftext|>"
    eos_token: "<|endoftext|>"

dataset:
  dataset_dir: "data"
  train_split: "train"
  val_split: "validation"
  test_split: "test"

training:
  batch_size: 16
  gradient_accumulation_steps: 4
  learning_rate: 6.0e-4
  min_learning_rate: 6.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_steps: 2000
  max_steps: 100000
  eval_interval: 500
  save_interval: 1000
  checkpoint_dir: "checkpoints"

inference:
  max_new_tokens: 512
  temperature: 0.7
  top_k: 50
  top_p: 0.9
